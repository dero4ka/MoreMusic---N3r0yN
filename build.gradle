plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    // Чистый Java MP3-декодер для проигрывания интернет-потоков колонкой.
    // Jar-in-Jar встраивает его прямо в jar мода, включать отдельно не нужно.
    jarJar(implementation('javazoom:jlayer:1.0.1')) {
        version {
            strictly '[1.0.1,1.1)'
            prefer '1.0.1'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            dependencies {
                // Делает jlayer доступным во время запуска (runClient/runServer),
                // не только при компиляции.
                runtime 'javazoom:jlayer:1.0.1'
            }
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version      : neo_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
